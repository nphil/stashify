/* Lucent v2. Pair with palette.css; HA uses ha.css instead. No implicit live blur.
 * Profile values are logical CSS px. Native ports resolve density once, not per frame. */
:root, [data-theme] {
  --lu-canvas: var(--pal-canvas);
  --lu-sheet: var(--pal-sheet);
  --lu-scrim: var(--pal-scrim);
  --lu-glass: var(--pal-glass);
  --lu-glass-raised: var(--pal-glass-raised);
  --lu-edge: var(--pal-edge);
  --lu-edge-raised: var(--pal-edge-raised);
  --lu-ink: var(--pal-ink);
  --lu-ink-2: var(--pal-ink-2);
  --lu-ink-3: var(--pal-ink-3);
  --lu-focus: var(--pal-focus);
  --lu-focus-ink: var(--pal-focus-ink);
  --lu-track-off: var(--pal-track-off);
  --lu-track-readable: color-mix(in srgb, var(--lu-ink) 60%, transparent);
  --lu-accent: var(--pal-accent);
  --lu-accent-ink: var(--pal-accent-ink);
  --lu-positive: var(--pal-positive);
  --lu-warning: var(--pal-warning);
  --lu-danger: var(--pal-danger);
  --lu-info: var(--pal-info);
  --lu-live: var(--pal-live);
  --lu-radius-sheet: 28px;
  --lu-radius-card: 24px;
  --lu-radius-tile: 20px;
  --lu-radius-row: 18px;
  --lu-radius-control: 14px;
  --lu-radius-pill: 999px;
  --lu-space-1: 4px;
  --lu-space-2: 8px;
  --lu-space-3: 12px;
  --lu-space-4: 16px;
  --lu-space-5: 20px;
  --lu-space-6: 24px;
  --lu-space-7: 32px;
  --lu-space-8: 40px;
  --lu-target: 48px;
  --lu-target-tv: 64px;
  --lu-blur: 30px;
  --lu-font: Manrope, system-ui, sans-serif;
  --lu-type-display: 56px;
  --lu-type-title: 20px;
  --lu-type-body: 16px;
  --lu-type-label: 14px;
  --lu-type-caption: 12px;
  --lu-type-body-line: 1.45;
  --lu-type-title-line: 1.25;

/* ============================================================
   Stashify mockups · app layer on top of Lucent v2 + Rosé Pine
   Components read --lu-* tokens only. Extra roles are derived below.
   ============================================================ */
:root, [data-theme] {
  --h-btn: var(--lu-target);
  --h-chip: calc(var(--lu-target) - var(--lu-space-2));
  --lu-press-wash: color-mix(in srgb, var(--lu-ink) 8%, transparent);
  --lu-hover-wash: var(--lu-material-hover-wash);
  --lu-reading: color-mix(in srgb, var(--lu-ink) 4%, var(--lu-canvas));
  --lu-scrim-hides: color-mix(in srgb, var(--lu-canvas) 97%, transparent);
  --lu-scrim-soft: color-mix(in srgb, var(--lu-canvas) 58%, transparent);
  --lu-over-pic: color-mix(in srgb, var(--lu-canvas) 82%, transparent);
  --lu-accent-fill: var(--lu-accent);
  --lu-accent-fill-ink: var(--lu-accent-ink);
  --lu-accent-text: var(--lu-accent);
  --lu-positive-text: var(--lu-positive);
  --lu-warning-text: var(--lu-warning);
  --lu-danger-text: var(--lu-danger);
  --lu-info-text: var(--lu-info);
  --lu-wallpaper:
    radial-gradient(1100px 640px at 6% -10%, color-mix(in srgb, var(--lu-accent) 15%, transparent), transparent 70%),
    radial-gradient(900px 560px at 104% 0%, color-mix(in srgb, var(--lu-live) 8%, transparent), transparent 70%),
    radial-gradient(1000px 720px at 50% 125%, color-mix(in srgb, var(--lu-info) 8%, transparent), transparent 70%),
    var(--lu-canvas);
}
[data-theme="light"] {
  --lu-accent-fill: color-mix(in srgb, var(--lu-accent) 78%, var(--lu-ink));
  --lu-accent-text: color-mix(in srgb, var(--lu-accent) 62%, var(--lu-ink));
  --lu-warning-text: color-mix(in srgb, var(--lu-warning) 55%, var(--lu-ink));
  --lu-danger-text: color-mix(in srgb, var(--lu-danger) 80%, var(--lu-ink));
  --lu-info-text: color-mix(in srgb, var(--lu-info) 62%, var(--lu-ink));
}

*, *::before, *::after { box-sizing: border-box; }

  background: var(--lu-wallpaper); color: var(--lu-ink);
  font: var(--lu-type-body-weight) var(--lu-type-body)/var(--lu-type-body-line) var(--lu-font);

dl, dd { margin: 0; }

.ico.s { --ico: 16px; } .ico.l { --ico: 24px; }

/* ---------- type ---------- */
.ttl { font: var(--lu-type-title-weight) var(--lu-type-title)/var(--lu-type-title-line) var(--lu-font); letter-spacing: var(--lu-type-title-tracking); }
.h   { font: 600 var(--lu-type-body)/1.3 var(--lu-font); }

.cap { font: var(--lu-type-caption-weight) var(--lu-type-caption)/1.35 var(--lu-font); letter-spacing: var(--lu-type-caption-tracking); }
.muted { color: var(--lu-ink-2); }
.pos { color: var(--lu-positive-text); } .warn { color: var(--lu-warning-text); } .bad { color: var(--lu-danger-text); } .acc { color: var(--lu-accent-text); } .inf { color: var(--lu-info-text); }
.row { display: flex; align-items: center; gap: var(--lu-space-3); }
.row.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1 1 0; min-width: 0; }
.nowrap { white-space: nowrap; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.right { margin-left: auto; }
.hr { height: 1px; background: var(--lu-material-edge); border: 0; margin: var(--lu-space-3) 0; }

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(var(--lu-travel-layer)); } to { opacity: 1; transform: none; } }

.enter { animation: rise var(--lu-motion-layer) var(--lu-ease) both; }
.enter-drawer { animation: drawer var(--lu-motion-layer) var(--lu-ease) both; }
html[data-shot] *, html[data-shot] *::before, html[data-shot] *::after { animation: none !important; transition: none !important; }

/* ---------- buttons: one size (target), press = wash, focus = raised glass ---------- */
.btn, .chip, .hp, .tab, .tok, .iconbtn, .seg button, .opt, .rec, .tile, .orow, .linkbtn, .sw {
  --raise: 0;
  transition: background-color var(--lu-motion-label) var(--lu-ease), box-shadow var(--lu-motion-focus) var(--lu-ease), transform var(--lu-motion-focus) var(--lu-ease), border-color var(--lu-motion-focus) var(--lu-ease);
}
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--lu-space-2);
  height: var(--h-btn); padding: 0 var(--lu-space-5); border-radius: var(--lu-radius-pill);
  border: 1px solid var(--lu-material-edge); background: transparent; color: var(--lu-ink);
  font: 600 var(--lu-type-label)/1 var(--lu-font); white-space: nowrap;
}

.btn.primary:hover:not([aria-disabled="true"]) { background-image: linear-gradient(var(--lu-hover-wash), var(--lu-hover-wash)); }
.btn:active:not([aria-disabled="true"]), .chip:active, .hp:active, .tab:active, .tok:active, .iconbtn:active, .opt:active, .rec:active, .orow:active { background-image: linear-gradient(var(--lu-press-wash), var(--lu-press-wash)); transition: none; }
.btn[aria-disabled="true"] { background: var(--lu-track-off); color: var(--lu-ink-2); border-color: transparent; cursor: not-allowed; }
.iconbtn { position: relative; display: inline-grid; place-items: center; width: var(--h-btn); height: var(--h-btn); border-radius: var(--lu-radius-pill); border: 0; background: transparent; color: var(--lu-ink-2); }
.iconbtn:hover { background-image: linear-gradient(var(--lu-hover-wash), var(--lu-hover-wash)); color: var(--lu-ink); }
.iconbtn.sm { width: var(--h-chip); height: var(--h-chip); }
.linkbtn { display: inline-flex; align-items: center; gap: var(--lu-space-1); min-height: var(--h-chip); padding: 0 var(--lu-space-2); border: 0; border-radius: var(--lu-radius-pill); background: transparent; color: var(--lu-ink-2); font: 600 var(--lu-type-label)/1 var(--lu-font); }
.linkbtn:hover { background-image: linear-gradient(var(--lu-hover-wash), var(--lu-hover-wash)); color: var(--lu-ink); }
/* Focus = raised glass: brighter fill + sheen + one soft shadow, edge softens. Never an outline. */
:is(.btn, .chip, .hp, .tab, .tok, .iconbtn, .linkbtn, .seg button, .opt, .rec, .tile, .orow, .sw):focus-visible {
  outline: none; background-color: var(--lu-glass-raised); background-image: var(--lu-sheen); border-color: var(--lu-edge-raised);
  box-shadow: var(--lu-shadow-pressed); transform: translateY(calc(var(--lu-lift-raised) / -2)) scale(var(--lu-profile-focus-scale, 1.02)); color: var(--lu-ink); z-index: var(--lu-z-raised);
}
.btn.primary:focus-visible { background-color: var(--lu-accent-fill); background-image: var(--lu-sheen); color: var(--lu-accent-fill-ink); }
.is-focus { background-color: var(--lu-glass-raised) !important; background-image: var(--lu-sheen) !important; border-color: var(--lu-edge-raised) !important; box-shadow: var(--lu-shadow-pressed); transform: translateY(calc(var(--lu-lift-raised) / -2)) scale(var(--lu-profile-focus-scale, 1.02)); color: var(--lu-ink) !important; }

/* chips: filters, tokens, header pills. Hit area grows to the 48 target, the visual stays 40. */
.chip, .hp, .tab, .tok {
  position: relative; display: inline-flex; align-items: center; gap: var(--lu-space-2); height: var(--h-chip); padding: 0 var(--lu-space-4);
  border-radius: var(--lu-radius-pill); border: 1px solid var(--lu-material-edge); background: var(--lu-glass); color: var(--lu-ink);
  font: 500 var(--lu-type-label)/1 var(--lu-font); white-space: nowrap;
}

.chip:hover, .hp:hover, .tok:hover { background-image: linear-gradient(var(--lu-hover-wash), var(--lu-hover-wash)); }
.chip .ico, .tok .ico { color: var(--lu-ink-2); }
.chip[data-on], .tok[data-on] { font-weight: 600; }
.chip[data-on]::before { content: ""; width: 8px; height: 8px; border-radius: var(--lu-radius-pill); background: var(--lu-accent-fill); }
.tab { border-color: transparent; background: transparent; color: var(--lu-ink-2); font-weight: 600; }
.tab:hover { background-image: linear-gradient(var(--lu-hover-wash), var(--lu-hover-wash)); color: var(--lu-ink); }
.tab[aria-current="page"] { background: var(--lu-focus-wash); color: var(--lu-ink); }
.count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--lu-radius-pill); background: var(--lu-accent-fill); color: var(--lu-accent-fill-ink); font: 700 var(--lu-type-caption)/1 var(--lu-font); }
.count.quiet { background: var(--lu-focus-wash); color: var(--lu-ink); }

/* segmented: 2–5 exclusive options in a well */
.seg { display: inline-flex; gap: 2px; padding: var(--lu-space-1); border-radius: var(--lu-radius-pill); background: var(--lu-material-well); box-shadow: var(--lu-neumorphic-inset); }
.seg button { position: relative; height: calc(var(--h-chip) - var(--lu-space-1)); padding: 0 var(--lu-space-4); border: 1px solid transparent; border-radius: var(--lu-radius-pill); background: transparent; color: var(--lu-ink-2); font: 600 var(--lu-type-label)/1 var(--lu-font); white-space: nowrap; }
.seg button:hover { color: var(--lu-ink); background-image: linear-gradient(var(--lu-hover-wash), var(--lu-hover-wash)); }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--lu-glass-raised); color: var(--lu-ink); box-shadow: var(--lu-neumorphic-raised); }

/* switch */
.sw { position: relative; width: 52px; height: 32px; padding: 0; border: 1px solid var(--lu-material-edge); border-radius: var(--lu-radius-pill); background: var(--lu-material-well); box-shadow: var(--lu-neumorphic-inset); flex: none; }

.sw::after { content: ""; position: absolute; inset: -8px -2px; }

/* search / text field */
.field { display: flex; align-items: center; gap: var(--lu-space-3); height: var(--h-btn); padding: 0 var(--lu-space-4); border-radius: var(--lu-radius-pill); background: var(--lu-material-well); box-shadow: var(--lu-neumorphic-inset); border: 1px solid var(--lu-material-edge); color: var(--lu-ink-2); }
.field input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: var(--lu-ink); font: 500 var(--lu-type-body)/1 var(--lu-font); outline: none; }
.field input::placeholder { color: var(--lu-ink-2); opacity: 1; }
.field:focus-within { background: var(--lu-glass-raised); border-color: var(--lu-edge-raised); box-shadow: var(--lu-shadow-pressed); }

/* ---------- status, meters, bars ---------- */
.st { display: inline-flex; align-items: center; gap: 6px; color: var(--tone, var(--lu-ink-2)); font: 600 var(--lu-type-caption)/1.2 var(--lu-font); white-space: nowrap; }
.st .ico { --ico: 16px; }
.st.ok { --tone: var(--lu-positive-text); } .st.run { --tone: var(--lu-info-text); } .st.warn { --tone: var(--lu-warning-text); } .st.bad { --tone: var(--lu-danger-text); } .st.off { --tone: var(--lu-ink-2); } .st.acc { --tone: var(--lu-accent-text); }
.dot { width: 8px; height: 8px; border-radius: var(--lu-radius-pill); background: currentColor; flex: none; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 var(--lu-space-2); border-radius: var(--lu-radius-pill); background: var(--lu-focus-wash); color: var(--lu-ink); font: 600 var(--lu-type-caption)/1 var(--lu-font); white-space: nowrap; }
.badge .ico { --ico: 14px; }
.badge.acc { background: color-mix(in srgb, var(--lu-accent) 18%, transparent); color: var(--lu-accent-text); }
.badge.pos { background: color-mix(in srgb, var(--lu-positive) 16%, transparent); color: var(--lu-positive-text); }
.badge.warn { background: color-mix(in srgb, var(--lu-warning) 18%, transparent); color: var(--lu-warning-text); }
.badge.bad { background: color-mix(in srgb, var(--lu-danger) 16%, transparent); color: var(--lu-danger-text); }
.rel { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; color: var(--lu-positive-text); }
.rel i { width: 3px; border-radius: 1px; background: var(--lu-track-off); }
.rel i:nth-child(1) { height: 5px; } .rel i:nth-child(2) { height: 8px; } .rel i:nth-child(3) { height: 11px; } .rel i:nth-child(4) { height: 14px; }
.rel i.on { background: currentColor; }
.rel.mid { color: var(--lu-info-text); } .rel.low { color: var(--lu-warning-text); }
.bar { position: relative; display: flex; height: 8px; border-radius: var(--lu-radius-pill); background: var(--lu-track-off); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lu-accent-fill); }
.bar i + i { margin-left: 2px; }
.bar i.spent { background: var(--lu-track-readable); }
.bar i.run { background: var(--lu-accent-fill); }
.bar.thick { height: 10px; }
.mini { position: relative; width: 34px; height: 6px; border-radius: var(--lu-radius-pill); background: var(--lu-track-off); overflow: hidden; flex: none; }
.mini i { position: absolute; inset: 0 auto 0 0; background: var(--lu-info-text); border-radius: var(--lu-radius-pill); }

/* glyph tile */
.gt { display: grid; place-items: center; flex: none; width: var(--h-btn); height: var(--h-btn); border-radius: var(--lu-radius-control); background: color-mix(in srgb, var(--tone, var(--lu-accent)) 16%, transparent); color: var(--tone-text, var(--lu-accent-text)); }
.gt.pos { --tone: var(--lu-positive); --tone-text: var(--lu-positive-text); } .gt.inf { --tone: var(--lu-info); --tone-text: var(--lu-info-text); } .gt.warn { --tone: var(--lu-warning); --tone-text: var(--lu-warning-text); } .gt.bad { --tone: var(--lu-danger); --tone-text: var(--lu-danger-text); } .gt.mute { --tone: var(--lu-ink); --tone-text: var(--lu-ink-2); }
.gt.sm { width: var(--h-chip); height: var(--h-chip); }

/* ---------- surfaces (Lucent classes + app panels) ---------- */
.panel { background: var(--lu-material-overlay); border: 1px solid var(--lu-material-edge); border-radius: var(--lu-radius-sheet); box-shadow: var(--lu-shadow-rest); }
.panel.card { border-radius: var(--lu-radius-card); }
.pop { background: var(--lu-reading); border: 1px solid var(--lu-material-edge); border-radius: var(--lu-radius-card); box-shadow: var(--lu-shadow-rest); z-index: var(--lu-z-popup); }
.well { background: var(--lu-material-well); border-radius: var(--lu-radius-row); box-shadow: var(--lu-neumorphic-inset); }
.sect { padding: var(--lu-space-4) 0; }
.sect + .sect { border-top: 1px solid var(--lu-material-edge); }

/* ---------- scene thumbnails: neutral gradient blocks, no real images ---------- */
.tn { --a: var(--lu-ink); --b: var(--lu-canvas); --c: var(--lu-canvas);
  background: radial-gradient(110% 70% at 20% 118%, var(--c) 0 46%, transparent 70%), radial-gradient(34% 46% at 74% 30%, color-mix(in srgb, var(--lu-ink) 14%, transparent), transparent 70%), linear-gradient(155deg, var(--a), var(--b)); }
.tn-1 { --a: color-mix(in srgb, var(--lu-info) 52%, var(--lu-canvas)); --b: color-mix(in srgb, var(--lu-accent) 34%, var(--lu-canvas)); --c: color-mix(in srgb, var(--lu-accent) 24%, var(--lu-canvas)); }
.tn-2 { --a: color-mix(in srgb, var(--lu-warning) 46%, var(--lu-canvas)); --b: color-mix(in srgb, var(--lu-live) 30%, var(--lu-canvas)); --c: color-mix(in srgb, var(--lu-live) 22%, var(--lu-canvas)); }
.tn-3 { --a: color-mix(in srgb, var(--lu-accent) 50%, var(--lu-canvas)); --b: color-mix(in srgb, var(--lu-info) 26%, var(--lu-canvas)); --c: color-mix(in srgb, var(--lu-info) 20%, var(--lu-canvas)); }
.tn-4 { --a: color-mix(in srgb, var(--lu-positive) 40%, var(--lu-canvas)); --b: color-mix(in srgb, var(--lu-warning) 28%, var(--lu-canvas)); --c: color-mix(in srgb, var(--lu-positive) 24%, var(--lu-canvas)); }
.tn-5 { --a: color-mix(in srgb, var(--lu-live) 40%, var(--lu-canvas)); --b: color-mix(in srgb, var(--lu-accent) 34%, var(--lu-canvas)); --c: color-mix(in srgb, var(--lu-accent) 22%, var(--lu-canvas)); }
.tn-6 { --a: color-mix(in srgb, var(--lu-ink) 24%, var(--lu-canvas)); --b: color-mix(in srgb, var(--lu-info) 28%, var(--lu-canvas)); --c: color-mix(in srgb, var(--lu-ink) 14%, var(--lu-canvas)); }
.pill-pic { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 var(--lu-space-2); border-radius: var(--lu-radius-pill); background: var(--lu-over-pic); color: var(--lu-ink); font: 700 var(--lu-type-caption)/1 var(--lu-font); }
.pill-pic .ico { --ico: 14px; }
.pill-pic.ok { color: var(--lu-positive-text); }

/* scene tile (selectable) */
.tile { position: relative; display: flex; flex-direction: column; gap: var(--lu-space-2); min-width: 0; padding: 0; border: 0; background: transparent; text-align: left; border-radius: var(--lu-radius-tile); }
.tile .frame { position: relative; border-radius: var(--lu-radius-tile); }
.tile .pic { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: var(--lu-radius-tile); overflow: hidden; transition: transform var(--lu-motion-card) var(--lu-ease), border-radius var(--lu-motion-card) var(--lu-ease); }
.tile .pic::after { content: ""; position: absolute; inset: 0; background: var(--lu-sheen); pointer-events: none; }
.tile .chk { position: absolute; top: var(--lu-space-3); left: var(--lu-space-3); z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--lu-radius-pill); border: 2px solid var(--lu-ink); background: var(--lu-over-pic); color: transparent; }

.tile[aria-checked="true"] .pic { transform: scale(.9); }
.tile[aria-checked="true"] .chk { background: var(--lu-accent-fill); border-color: var(--lu-accent-fill); color: var(--lu-accent-fill-ink); }
.tile:hover .pic { transform: scale(.985); }
.tile[aria-checked="true"]:hover .pic { transform: scale(.9); }
.tile .pp { position: absolute; z-index: 1; }

.lib-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--lu-space-2); padding-bottom: var(--lu-space-4); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--lu-space-4); }

.pager { display: flex; align-items: center; justify-content: space-between; padding: var(--lu-space-5) 0; }
ul.plain { list-style: none; margin: var(--lu-space-3) 0 0; padding: 0; display: grid; gap: var(--lu-space-2); }

/* dialogs: the autofocused safe button reads as focused even without a key press */
dialog.dlg .btn:focus { outline: none; background-color: var(--lu-glass-raised); background-image: var(--lu-sheen); border-color: var(--lu-edge-raised); box-shadow: var(--lu-shadow-pressed); transform: translateY(calc(var(--lu-lift-raised) / -2)) scale(var(--lu-profile-focus-scale, 1.02)); color: var(--lu-ink); }
/* the app at 200% text, used to test that nothing overlaps */

/* ---------- jobs ---------- */
.job { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: var(--lu-space-5); padding: var(--lu-space-5); border-radius: var(--lu-radius-card); background: var(--lu-material-card); border: 1px solid var(--lu-material-edge); }
.jmedia { display: grid; grid-template-columns: 1fr 1fr; gap: var(--lu-space-2); align-content: start; }

.jwhere { display: flex; flex-wrap: wrap; align-items: center; gap: var(--lu-space-1) var(--lu-space-3); color: var(--lu-ink-2); font: 500 var(--lu-type-label)/1.3 var(--lu-font); }
.jwhere span { display: inline-flex; align-items: center; gap: 6px; }
.jprog { display: flex; align-items: baseline; justify-content: space-between; gap: var(--lu-space-3); }
.jprog b { font: 700 var(--lu-type-title)/1 var(--lu-font); }

.jobs { display: grid; gap: var(--lu-space-4); }
.phases { display: flex; flex-wrap: wrap; gap: 2px var(--lu-space-4); color: var(--lu-ink-2); font: 500 var(--lu-type-caption)/1.4 var(--lu-font); }

.qlist { display: grid; }
.qrow { display: flex; align-items: center; gap: var(--lu-space-3); min-height: var(--lu-row); padding: var(--lu-space-2) var(--lu-space-3); border-radius: var(--lu-radius-row); }
.qrow + .qrow { border-top: 1px solid var(--lu-material-edge); border-radius: 0; }

/* ---------- review compare stage ---------- */
.cmp { position: relative; aspect-ratio: 16 / 9; border-radius: var(--lu-radius-card); overflow: hidden; --x: 50%; background: var(--lu-material-well); }
.cmp .lay { position: absolute; inset: 0; }

.cmp .grip span { position: absolute; top: 50%; left: 0; display: grid; place-items: center; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: var(--lu-radius-pill); background: var(--lu-over-pic); color: var(--lu-ink); border: 1px solid var(--lu-edge-raised); }
.cmp .wipe { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.cmp:has(.wipe:focus-visible) .grip span { background: var(--lu-glass-raised); background-image: var(--lu-sheen); border-color: var(--lu-edge-raised); box-shadow: var(--lu-shadow-pressed); transform: scale(var(--lu-profile-focus-scale, 1.02)); }
.cmp-lbl { display: flex; justify-content: space-between; gap: var(--lu-space-3); padding: var(--lu-space-2) var(--lu-space-1) 0; color: var(--lu-ink-2); font: 500 var(--lu-type-label)/1.3 var(--lu-font); }
.cmp-lbl b { color: var(--lu-ink); font-weight: 600; }
.scene { position: absolute; inset: 0; background: radial-gradient(64% 34% at 22% 100%, var(--c) 0 52%, transparent 74%), radial-gradient(70% 38% at 86% 104%, color-mix(in srgb, var(--c) 80%, var(--lu-ink)) 0 46%, transparent 72%), radial-gradient(11% 19% at 76% 26%, color-mix(in srgb, var(--lu-ink) 22%, transparent), transparent 80%), linear-gradient(170deg, var(--a), var(--b)); }
.scene.big { --a: color-mix(in srgb, var(--lu-info) 56%, var(--lu-canvas)); --b: color-mix(in srgb, var(--lu-accent) 36%, var(--lu-canvas)); --c: color-mix(in srgb, var(--lu-accent) 26%, var(--lu-canvas)); }
.patch { position: absolute; left: 34%; top: 33%; width: 26%; height: 38%; border-radius: var(--lu-radius-control); overflow: hidden; }
.patch.blocks { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(8, 1fr); }
.patch.blocks i { background: color-mix(in srgb, var(--lu-ink) calc(var(--l) * 1%), var(--lu-canvas)); }
.patch.clean { background: radial-gradient(70% 60% at 42% 36%, color-mix(in srgb, var(--lu-ink) 30%, transparent), transparent 72%), radial-gradient(60% 70% at 70% 74%, color-mix(in srgb, var(--lu-live) 28%, transparent), transparent 74%), linear-gradient(160deg, color-mix(in srgb, var(--lu-ink) 16%, var(--lu-canvas)), color-mix(in srgb, var(--lu-ink) 8%, var(--lu-canvas))); }
.tline { position: relative; height: 36px; display: flex; align-items: center; }
.tline .tk { position: relative; flex: 1 1 auto; height: 10px; border-radius: var(--lu-radius-pill); background: var(--lu-track-off); }
.tline .tk i { position: absolute; top: 0; bottom: 0; border-radius: var(--lu-radius-pill); background: var(--lu-accent-fill); opacity: .75; }
.tline .tk em { position: absolute; top: -5px; width: 4px; height: 20px; margin-left: -2px; border-radius: var(--lu-radius-pill); background: var(--lu-ink); }

/* ---------- runners / settings ---------- */
.runner { container-type: inline-size; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--lu-space-4); align-items: center; padding: var(--lu-space-4) 0; }
.runner + .runner { border-top: 1px solid var(--lu-material-edge); }

.chips { display: flex; flex-wrap: wrap; gap: var(--lu-space-2); }

.setrow .sl span { color: var(--lu-ink-2); font: 400 var(--lu-type-label)/1.4 var(--lu-font); }
.stepper { display: inline-flex; align-items: center; gap: var(--lu-space-1); padding: var(--lu-space-1); border-radius: var(--lu-radius-pill); background: var(--lu-material-well); box-shadow: var(--lu-neumorphic-inset); }
.stepper b { min-width: 76px; text-align: center; font: 700 var(--lu-type-body)/1 var(--lu-font); }
.ledger { width: 100%; border-collapse: collapse; font: 500 var(--lu-type-label)/1.3 var(--lu-font); }
.ledger th { padding: 0 var(--lu-space-3) var(--lu-space-2) 0; text-align: left; color: var(--lu-ink-2); font: 600 var(--lu-type-caption)/1.2 var(--lu-font); }
.ledger td { padding: var(--lu-space-3) var(--lu-space-3) var(--lu-space-3) 0; border-top: 1px solid var(--lu-material-edge); }
.ledger .r { text-align: right; padding-right: 0; }

/* ---------- states board ---------- */
.edge { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--lu-space-4); }
.efr { display: flex; flex-direction: column; gap: var(--lu-space-3); min-width: 0; padding: var(--lu-space-5); border-radius: var(--lu-radius-card); background: var(--lu-material-card); border: 1px solid var(--lu-material-edge); }
.skels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--lu-space-3); }

/* ---------- dialog (top layer, opaque backdrop) ---------- */
dialog.dlg { padding: 0; border: 1px solid var(--lu-material-edge); border-radius: var(--lu-radius-sheet); background: var(--lu-reading); color: var(--lu-ink); box-shadow: var(--lu-shadow-raised); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; }

.dlg .dh { padding: var(--lu-space-6) var(--lu-space-6) var(--lu-space-3); }
.dlg .db { padding: 0 var(--lu-space-6) var(--lu-space-4); }
.dlg .df { display: flex; flex-wrap: wrap; gap: var(--lu-space-2); justify-content: flex-end; padding: var(--lu-space-3) var(--lu-space-6) var(--lu-space-6); }
html[data-lu-profile="phone"] .dlg .df { flex-direction: column; align-items: stretch; padding-inline: var(--lu-space-5); }
html[data-lu-profile="phone"] .dlg .df .btn { justify-content: center; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: var(--lu-space-2) var(--lu-space-5); align-items: baseline; font: 500 var(--lu-type-label)/1.35 var(--lu-font); }
.facts dt { color: var(--lu-ink-2); }
.facts dd { text-align: right; font-weight: 600; }
.facts dd small { display: block; color: var(--lu-ink-2); font: 400 var(--lu-type-caption)/1.35 var(--lu-font); }

/* toast */
.toast { display: inline-flex; align-items: center; gap: var(--lu-space-3); height: var(--h-btn); padding: 0 var(--lu-space-5); border-radius: var(--lu-radius-pill); background: var(--lu-reading); border: 1px solid var(--lu-material-edge); box-shadow: var(--lu-shadow-rest); font: 600 var(--lu-type-label)/1 var(--lu-font); }

/* mock chrome: lives OUTSIDE the product UI */
.mock { position: fixed; z-index: 90; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: color-mix(in srgb, var(--lu-canvas) 92%, var(--lu-ink)); border-bottom: 1px solid var(--lu-material-edge); font: 600 12px/1 var(--lu-font); overflow-x: auto; }
.mock b { margin-right: 6px; white-space: nowrap; }
.mock button { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--lu-material-edge); background: transparent; color: var(--lu-ink); font: 600 12px/1 var(--lu-font); white-space: nowrap; }
.mock button[aria-pressed="true"] { background: var(--lu-accent-fill); color: var(--lu-accent-fill-ink); border-color: transparent; }
.mock .sep { width: 1px; height: 18px; background: var(--lu-material-edge); flex: none; }
html[data-shot] .mock { display: none; }
body:not([data-shot-body]) .appfit { height: calc(100vh - 44px); margin-top: 44px; }
html[data-shot] .appfit { height: 100vh; margin-top: 0; }
@media (prefers-reduced-motion: reduce) { .enter, .enter-drawer { animation: fade var(--lu-motion-reduce) linear both; } }

/* ===== shared chrome for all three concepts: app bar, tabs, bottom nav, page header ===== */
.appbar { flex: none; display: flex; align-items: center; gap: var(--lu-space-4); height: var(--lu-shell-app-bar); padding: 0 var(--lu-edge-x); }
.appbar .brand { display: inline-flex; align-items: center; gap: var(--lu-space-2); font: 700 var(--lu-type-body)/1 var(--lu-font); letter-spacing: var(--lu-type-title-tracking); }
.appbar .brand .ico { --ico: 26px; color: var(--lu-accent-text); }
.apptabs { display: flex; gap: var(--lu-space-1); margin-left: var(--lu-space-3); }
.appbar .pills { margin-left: auto; }
.pagehd { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--lu-space-4); padding: var(--lu-space-3) 0 var(--lu-space-5); }
.narrow { max-width: 1040px; margin: 0 auto; }
.bnav { display: none; position: absolute; z-index: var(--lu-z-chrome); left: 0; right: 0; bottom: 0; height: var(--lu-shell-bottom-bar); background: var(--lu-reading); border-top: 1px solid var(--lu-material-edge); }
.bn { position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: transparent; color: var(--lu-ink-2); font: 600 var(--lu-type-caption)/1 var(--lu-font); }
.bn[aria-current="page"] { color: var(--lu-ink); }
.bn[aria-current="page"] .ico { color: var(--lu-accent-text); }
.bn:focus-visible { outline: none; background: var(--lu-glass-raised); background-image: var(--lu-sheen); box-shadow: var(--lu-shadow-pressed); color: var(--lu-ink); }
html[data-lu-profile="phone"] .bnav { display: flex; }
html[data-lu-profile="phone"] .apptabs, html[data-lu-profile="phone"] .appbar .bt { display: none; }
html[data-lu-profile="phone"] .appbar { gap: var(--lu-space-2); }
.toastwrap { position: absolute; z-index: var(--lu-z-popup); left: 0; right: 0; bottom: calc(var(--toast-b, var(--lu-space-5)) + var(--lu-space-4)); display: flex; justify-content: center; pointer-events: none; }

/* ===== Concept B · Inspector ===== */
.b-shell { position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden; }
.b-body { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: var(--lu-space-5); padding: var(--lu-space-2) var(--lu-edge-x) var(--lu-space-5); }
.b-body.solo { grid-template-columns: minmax(0, 1fr); }
.b-main { min-width: 0; min-height: 0; overflow: auto; }
.b-main > .wrap { max-width: 1600px; margin: 0 auto; }
.b-body.rbp .b-main { overflow: hidden; }
.b-body.rbp .b-main > .wrap, .b-rbpage { height: 100%; }
.b-rbpage.sheet, .b-pane { padding: var(--lu-space-5); border-radius: var(--lu-radius-sheet); background: var(--lu-reading); border: 1px solid var(--lu-material-edge); box-shadow: var(--lu-shadow-raised); }
.b-rbpage.sheet { display: flex; flex-direction: column; }
.b-rbpage.sheet .rb { flex: 1 1 auto; height: auto; min-height: 0; }

/* the inspector */
.insp { align-self: start; max-height: 100%; min-height: 0; display: flex; flex-direction: column; border-radius: var(--lu-radius-sheet); background: var(--lu-reading); border: 1px solid var(--lu-material-edge); box-shadow: var(--lu-shadow-raised); overflow: hidden; }
.insp-b { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: var(--lu-space-3); padding: var(--lu-space-5) var(--lu-space-5) var(--lu-space-3); }
.insp-f { flex: none; display: grid; gap: var(--lu-space-3); padding: var(--lu-space-4) var(--lu-space-5) var(--lu-space-5); border-top: 1px solid var(--lu-material-edge); }
.insp-f.pair { display: flex; flex-wrap: wrap; gap: var(--lu-space-2); }
.insp-f.pair .btn { flex: 1 1 auto; border-color: var(--lu-material-edge); }
.insp-f .btn:focus { outline: none; background-color: var(--lu-glass-raised); background-image: var(--lu-sheen); border-color: var(--lu-edge-raised); box-shadow: var(--lu-shadow-pressed); color: var(--lu-ink); }
.insp-f .btn.primary:focus { background-color: var(--lu-accent-fill); color: var(--lu-accent-fill-ink); }
.insp .job { padding: 0; border: 0; background: none; box-shadow: none; border-radius: 0; }
.isum { display: flex; flex-wrap: wrap; gap: var(--lu-space-1) var(--lu-space-2); }
.inudge { display: flex; }
.b-sel { display: grid; padding-top: var(--lu-space-3); }
.b-sel .mt { display: block; flex: none; width: 56px; height: 36px; border-radius: var(--lu-radius-control); }
.ihead { display: flex; align-items: center; gap: var(--lu-space-3); }
.stk { display: flex; flex: none; padding-left: 18px; }
.stk i { display: block; width: 56px; height: 36px; margin-left: -18px; border: 2px solid var(--lu-reading); border-radius: var(--lu-radius-control); }
.accs { border-top: 1px solid var(--lu-material-edge); }
.acc + .acc { border-top: 1px solid var(--lu-material-edge); }
.acch { display: flex; align-items: center; gap: var(--lu-space-3); width: 100%; min-height: var(--lu-row); margin: var(--lu-space-1) 0; padding: var(--lu-space-1) var(--lu-space-2); border: 1px solid transparent; border-radius: var(--lu-radius-control); background: transparent; color: var(--lu-ink); font: 600 var(--lu-type-label)/1.25 var(--lu-font); text-align: left; }
.acch:hover { background-image: linear-gradient(var(--lu-hover-wash), var(--lu-hover-wash)); }
.acch .al { flex: none; width: 64px; color: var(--lu-ink-2); font-weight: 500; }
.acch .av { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.acch .cv { flex: none; color: var(--lu-ink-2); transition: transform var(--lu-motion-focus) var(--lu-ease); }
.acch[aria-expanded="true"] .cv { transform: rotate(180deg); }
.accb { padding: 0 0 var(--lu-space-3); }
.blk { display: grid; gap: var(--lu-space-1); padding-top: var(--lu-space-3); }
.brow { display: flex; align-items: center; gap: var(--lu-space-3); width: 100%; min-height: var(--lu-row); padding: var(--lu-space-2); border: 1px solid transparent; border-radius: var(--lu-radius-row); background: transparent; color: var(--lu-ink); text-align: left; }
.brow:hover { background-image: linear-gradient(var(--lu-hover-wash), var(--lu-hover-wash)); }
.brow > .ico:last-child { color: var(--lu-ink-2); }

/* jobs list */
.jlist { display: grid; gap: var(--lu-space-2); padding-bottom: var(--lu-space-5); }
.jrow { display: flex; align-items: center; gap: var(--lu-space-3); width: 100%; min-height: var(--lu-row); padding: var(--lu-space-3) var(--lu-space-4); border: 1px solid var(--lu-material-edge); border-radius: var(--lu-radius-tile); background: var(--lu-material-control); color: var(--lu-ink); text-align: left; }
.jrow:hover { background-image: linear-gradient(var(--lu-hover-wash), var(--lu-hover-wash)); }
.jrow[aria-current="true"] { background-image: linear-gradient(var(--lu-material-selected-wash), var(--lu-material-selected-wash)); }
.jrow .end { flex: none; align-items: flex-end; gap: 2px; }

/* phone: the inspector is a sheet over the library */
html[data-lu-profile="phone"] .toastwrap { --toast-b: calc(var(--lu-shell-bottom-bar) + var(--lu-space-2)); }
html[data-lu-profile="phone"] .b-body { display: block; overflow: auto; padding: var(--lu-space-1) var(--lu-edge-x) calc(var(--lu-shell-bottom-bar) + var(--lu-space-5)); }
html[data-lu-profile="phone"] .b-body:has(> .insp.sheet) { padding-bottom: 400px; }
html[data-lu-profile="phone"] .b-main { overflow: visible; }
html[data-lu-profile="phone"] .b-body.rbp { display: flex; flex-direction: column; overflow: hidden; padding: 0 0 var(--lu-shell-bottom-bar); }
html[data-lu-profile="phone"] .b-body.rbp .b-main { flex: 1 1 0; overflow: hidden; }
html[data-lu-profile="phone"] .b-rbpage.sheet { padding: var(--lu-space-4) var(--lu-space-3) var(--lu-space-3); border-radius: var(--lu-radius-sheet) var(--lu-radius-sheet) 0 0; }

/* ---------- formatting ---------- */
const pad2 = n => String(n).padStart(2, '0');
function fmtDur(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad2(m)}:${pad2(x)}` : `${m}:${pad2(x)}`; }
function fmtMin(min) { min = Math.max(1, Math.round(min)); if (min < 60) return `${min} min`; const h = Math.floor(min / 60), m = min % 60; return m ? `${h} h ${pad2(m)} min` : `${h} h`; }
const usd = (n, d = 2) => '$' + n.toFixed(d);
const gbf = n => (n >= 10 ? n.toFixed(0) : n.toFixed(1)) + ' GB';
const resName = h => h >= 2160 ? '4K' : h + 'p';

/* ---------- selection maths ---------- */
function selInfo(ids) {
  const list = SCENES.filter(s => ids.includes(s.id));
  const dur = list.reduce((a, s) => a + s.dur, 0);
  const eff = list.reduce((a, s) => a + s.dur * RES_F[s.h], 0);
  const gb = list.reduce((a, s) => a + s.gb, 0);
  return { list, n: list.length, dur, eff, gb };
}
function baseSpeed(op, q) { /* x realtime on the RTX 3080 at home */
  if (op === 'upscale') return 2.7;
  if (op === 'transcode') return 6.0;
  const b = QUALITIES[q].speed;
  return op === 'decensor_up' ? b * 0.75 : b;
}
function modelsGB(op, q) { return op === 'upscale' ? 1.5 : QUALITIES[q].models + (op === 'decensor_up' ? 1.5 : 0); }

/* Home estimate: minutes + whether this runner can do it. */
function homeQuote(info, op, q, runnerId, size) {
  const r = RUNNERS[runnerId];
  let why = null;
  if ((op === 'decensor' || op === 'decensor_up') && !r.qualities.includes(q)) why = 'Fast quality only';
  let speed = baseSpeed(op, op === 'transcode' ? 'fast' : q) * r.g;
  if (op === 'transcode') speed = runnerId === 'pc' ? 6.0 : 4.5;
  const min = info.eff / speed / 60;
  return { ok: !why, why, min, usd: 0 };
}

/* What an offer has to be able to do for the current job. */
function jobReq(S, info) {
  const q = S.op === 'transcode' ? 'fast' : S.q;
  const vram = S.op === 'upscale' ? 6 : ({ fast: 6, balanced: 8, high: 10, max: 12 })[q];
  const diskGB = Math.max(40, Math.ceil(info.gb * 3 + modelsGB(S.op, q) + 10));
  return { vram, diskGB, cuda: 12.4 };
}
/* Hardware reasons an offer cannot run the job (short, plain). null = it can. */
function fitReason(S, info, o) {
  const r = jobReq(S, info);
  if (o.arch === 'Pascal') return 'Needs an RTX 20-series or newer';
  if (o.vram < r.vram) return `Needs ${r.vram} GB+ video memory`;
  if (o.free < r.diskGB) return `Disk too small (needs ${r.diskGB} GB)`;
  if (o.cuda < r.cuda) return `Needs CUDA ${r.cuda} or newer`;
  return null;
}
const r2 = x => Math.round(x * 100) / 100;

/* Cloud estimate for one offer. Returns every line of the bill so the UI can show a breakdown.
   Each line is rounded to cents and the total is their sum, so the receipt always adds up. */
function cloudQuote(info, op, q, o, S) {
  const speed = baseSpeed(op, q) * o.g;
  const runMin = info.eff / speed / 60;
  const gbUp = info.gb, gbDown = info.gb * OUT_F[op], gbModels = modelsGB(op, q);
  const upMin = gbUp * 8000 / Math.min(NET.ourUp, o.down) / 60;
  const downMin = gbDown * 8000 / Math.min(NET.ourDown, o.up) / 60;
  const modelMin = gbModels * 8000 / o.down / 60;
  const bootMin = 2.5;
  const minutes = bootMin + modelMin + upMin + runMin + downMin;
  const hours = minutes / 60;
  const gbTotal = gbUp + gbDown + gbModels;
  const diskGB = Math.max(40, Math.ceil(info.gb * 3 + gbModels + 10));
  const compute = r2(hours * o.price);
  const transfer = r2(gbTotal * o.perGB);
  const storage = Math.max(0.01, r2(diskGB * o.stor / 720 * hours));
  const total = r2(compute + transfer + storage);
  const monthLeft = BUDGET.month - BUDGET.spent;
  let why = S ? fitReason(S, info, o) : null;
  if (!why) {
    if (o.price > BUDGET.maxHour + 1e-9) why = `Over your ${usd(BUDGET.maxHour)}/h limit`;
    else if (total > BUDGET.jobCap) why = `Over your ${usd(BUDGET.jobCap)} stop per rental`;
    else if (total > monthLeft + 1e-9) why = 'Over this month’s limit';
    else if (total > BUDGET.credit + 1e-9) why = 'Not enough credit';
  }
  return { ok: !why, why, minutes, hours, runMin, compute, transfer, storage, total, max: r2(total * 1.25),
    gbUp, gbDown, gbModels, gbTotal, diskGB, perGB: o.perGB, price: o.price, upMin, downMin, modelMin, bootMin };
}
function withBudget(patch, fn) { const old = { ...BUDGET }; Object.assign(BUDGET, patch); try { return fn(); } finally { Object.assign(BUDGET, old); } }

/* A provider's offers show when it is connected (1 or 2 providers in the mockups) and its chip is on. */
const provOn = (S, o) => (S.providers >= 2 || o.prov === 'Vast.ai') && (!S.pf || S.pf[o.prov] !== false);
/* Offers that pass the owner's own switches (providers connected, data centres only). */
function visibleOffers(S) {
  return OFFERS.filter(o => provOn(S, o) && (!S.dcOnly || o.tier === 'dc'));
}
/* The four one-click recommendations. Each offer is used once; roles it also wins are added as tags. */
function recommend(S, info) {
  const rows = visibleOffers(S).filter(o => o.n === 1).map(o => ({ o, q: cloudQuote(info, S.op, S.q, o, S) })).filter(r => r.q.ok);
  if (!rows.length) return [];
  const by = (f, asc = true) => rows.slice().sort((a, b) => asc ? f(a) - f(b) : f(b) - f(a));
  const value = r => r.q.total * Math.pow(r.q.hours, 0.6);
  const picks = [
    { role: 'value',    label: 'Best value',    list: by(value).filter(r => r.o.rel >= 98.5) },
    { role: 'fast',     label: 'Fastest',       list: by(r => r.q.minutes) },
    { role: 'cheap',    label: 'Cheapest',      list: by(r => r.q.total) },
    { role: 'reliable', label: 'Most reliable', list: by(r => r.o.rel * 1000 - r.q.total, false) },
  ];
  const used = new Set(), out = [];
  for (const p of picks) {
    const r = p.list.find(x => !used.has(x.o.id));
    if (r) { used.add(r.o.id); out.push({ ...r, role: p.role, label: p.label, tags: [p.label] }); }
  }
  return out;
}

const perfOf = o => o.perfOne * o.n, tfOf = o => o.tf * o.n, vramOf = o => o.vram * o.n;

/* Returns { rows, total, blocked }. rows = [{o, q}] after filters + sort. q is null with no job. */
function browse(S, info) {
  const F = S.f, job = !!S.job;
  const all = OFFERS.filter(o => provOn(S, o)).map(o => ({ o, q: job ? cloudQuote(info, S.op, S.q, o, S) : null }));
  const rows = all.filter(({ o, q }) => {
    if (S.dcOnly && o.tier !== 'dc') return false;
    if (F.model !== 'any' && o.gpu !== F.model) return false;
    if (F.count !== 'any' && o.n !== F.count) return false;
    if (F.region !== 'any' && o.region !== F.region) return false;
    if (o.free < F.disk || o.rel < F.rel || o.days < F.days || o.cuda < F.cuda || o.drv < F.drv) return false;
    if (!F.unverified && !o.ver) return false;
    if (o.rented && !F.rented) return false;
    if (job && !F.cantRun && q.why) return false;
    return true;
  });
  const sort = S.sort === 'auto' ? (job ? 'jobauto' : 'perfusd') : S.sort;
  const K = {
    jobauto: r => (r.q.why ? 1e6 : 0) + r.q.total * Math.pow(r.q.hours, 0.6),
    total: r => (r.q.why ? 1e6 : 0) + r.q.total, time: r => (r.q.why ? 1e6 : 0) + r.q.minutes,
    perfusd: r => -valueOf(r.o), perf: r => -perfOf(r.o), tfusd: r => -tfOf(r.o) / r.o.price, tf: r => -tfOf(r.o),
    plow: r => r.o.price, phigh: r => -r.o.price, vram: r => -vramOf(r.o), vramusd: r => -vramOf(r.o) / r.o.price,
  }[sort];
  rows.sort((a, b) => K(a) - K(b));
  return { rows, total: all.length, blocked: job ? rows.filter(r => r.q.why).length : 0 };

function activeFilters(S) {
  const F = S.f, n = [];
  for (const k of ['disk', 'rel', 'days', 'cuda', 'drv']) if (F[k] !== FDEF[k]) n.push(k);
  if (S.dcOnly) n.push('dc');
  if (!F.unverified) n.push('unv');
  if (S.job && !F.cantRun) n.push('cant');
  if (F.rented) n.push('rented');
  return n.length;
}

/* ===== core: shared state, render loop, events, mock bar. Each concept supplies APP = { name, states, view(S), act(name, el, e) }. ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const P = new URLSearchParams(location.search);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ck = on => (on ? 'true' : 'false');
const I = (n, c = '') => ico(n, c);

const S = {
  theme: P.get('theme') === 'light' ? 'light' : 'dark',
  view: 'library', overlay: null, menu: null, rc: null, rbf: false, toast: null, ph: false,
  sel: [1, 2, 3], find: '', libSort: 'Newest', minRes: 0, tag: null,
  op: 'decensor', q: 'high', size: 'keep', adv: false,
  kn: { denoise: 'off', rtx: 'off', rtxfx: false, preview: false, detect: 'fast' },
  where: 'pc', pick: 'v1', browse: false,
  providers: +(P.get('prov') || 1), dcOnly: false, job: P.get('job') !== '0',
  sort: 'auto', f: { ...FDEF }, rx: { v1: 1 },
  paused: false, jobStarted: false, decided: null, edge: null, pf: {}, wipe: 50, run: null,
};
let APP = null;
let CONCEPT_ID = '';

/* ---------- derived ---------- */
const INFO = () => selInfo(S.sel);
function whereQuote(info) {
  if (S.where === 'cloud') {
    const o = OFFERS.find(x => x.id === S.pick);
    const q = cloudQuote(info, S.op, S.q, o, S);
    return { kind: 'cloud', o, q, min: q.minutes, ok: q.ok, why: q.why, usd: q.total };
  }
  const h = homeQuote(info, S.op, S.q, S.where, S.size);
  return { kind: 'home', min: h.min, ok: h.ok, why: h.why, usd: 0 };
}
function cheapestRec(info) {
  const r = recommend(S, info);
  if (!r.length) return null;
  return r.slice().sort((a, b) => a.q.total - b.q.total)[0];
}
const jobName = () => `${OPS[S.op].name}${S.op === 'transcode' ? ' · ' + SIZES[S.size] : (S.op === 'upscale' ? '' : ' · ' + QUALITIES[S.q].name)}`;
const gpuName = o => `${o.n}× ${o.gname}`;
const perGBtxt = o => (o.perGB ? `$${o.perGB.toFixed(3)}/GB` : 'no transfer fee');
function enterKey(k) { S._enterKey = k; }
const E = k => (S._enterNow === k ? ' enter' : '');

/* ---------- render ---------- */
/* keyboard focus survives a re-render: find the same control again by its data attributes */
function sigOf(el) {
  const t = el && el.closest ? el.closest('[data-act]') : null; if (!t) return null;
  const d = t.dataset; return `[data-act="${d.act}"]` + ['id', 'v', 'k', 'm', 'dir'].filter(k => d[k] != null).map(k => `[data-${k}="${d[k]}"]`).join('');
}
function render() {
  const root = $('#app');
  const keep = {}, fs = sigOf(document.activeElement);
  $$('[data-scroll]', root).forEach(el => { keep[el.dataset.scroll] = el.scrollTop; });
  S.ph = innerWidth < 600;
  S._enterNow = S._enterKey; S._enterKey = null;
  root.innerHTML = APP.view(S);
  $$('[data-scroll]', root).forEach(el => { if (keep[el.dataset.scroll] != null) el.scrollTop = keep[el.dataset.scroll]; });
  const dlg = $$('dialog[data-modal]', root);
  dlg.forEach(d => {
    d.addEventListener('cancel', e => { e.preventDefault(); act('close'); });
    d.addEventListener('click', e => { if (e.target === d) act('close'); });
    d.showModal();
  });
  if (fs && !dlg.length) { const n = $(fs, root); if (n) n.focus({ preventScroll: true }); }
  document.documentElement.dataset.theme = S.theme;
  syncMock();
  if (S.rc) { const all = [...document.querySelectorAll(`.tip[data-id="${S.rc}"] .iconbtn`)], a = all.find(x => x.closest('.rec')) || all[0]; if (a) showRc(S.rc, a); } else hideRc();
  APP.after && APP.after(S);
}

/* ---------- floating receipt (never clipped by a scrolling list) ---------- */
function receiptHTML(q, o) {
  const free = !o.perGB;
  return `<div class="rc">
    <span>Compute<span class="why">${fmtMin(q.minutes)} × ${usd(o.price)}/h</span></span><span class="v">${usd(q.compute)}</span>
    <span>Data transfer<span class="why">${free ? 'No transfer fee at ' + o.prov : gbf(q.gbTotal) + ' × ' + perGBtxt(o)}</span></span><span class="v">${usd(q.transfer)}</span>
    <div class="sub"><span>Upload · your video</span><span>${gbf(q.gbUp)}</span><span>Download · the result</span><span>${gbf(q.gbDown)}</span><span>Machine setup · models</span><span>${gbf(q.gbModels)}</span></div>
    <span>Storage<span class="why">${q.diskGB} GB for ${fmtMin(q.minutes)}</span></span><span class="v">${usd(q.storage)}</span>
    <div class="tot"><span>Estimated total</span><span>${usd(q.total)}</span></div>
  </div><p class="note">Could reach about ${usd(q.max)} if the machine runs slower. Stops by itself at ${usd(BUDGET.jobCap)}.</p>`;
}
function ensureFloat() {
  let f = $('#rcfloat');
  if (!f) { f = document.createElement('div'); f.id = 'rcfloat'; f.className = 'rcfloat pop'; f.hidden = true; f.setAttribute('role', 'tooltip'); document.body.appendChild(f); }
  return f;
}
function showRc(id, anchor) {
  const o = OFFERS.find(x => x.id === id); if (!o) return;
  const f = ensureFloat();
  f.innerHTML = receiptHTML(cloudQuote(INFO(), S.op, S.q, o, S), o);
  f.hidden = false;
  const r = anchor.getBoundingClientRect(), w = f.offsetWidth, h = f.offsetHeight;
  const left = Math.min(Math.max(8, r.right - w + 8), innerWidth - w - 8);
  let top = r.bottom + 8; if (top + h > innerHeight - 8) top = r.top - h - 8; if (top < 8) top = 8;
  if (top + h > innerHeight - 8) top = Math.max(8, innerHeight - h - 8);
  f.style.left = left + 'px'; f.style.top = top + 'px';
}
function hideRc() { const f = $('#rcfloat'); if (f) f.hidden = true; }

/* ---------- events ---------- */
function startRun() {
  const info = INFO(), w = whereQuote(info), names = info.list.map(s => s.title), cloud = S.where === 'cloud';
  S.run = { name: names.length > 1 ? `${names[0]} and ${names.length - 1} more` : names[0], op: jobName(), where: cloud ? 'cloud' : 'home', gpu: cloud ? `${w.o.gname} · ${w.o.loc.split(',')[0]}` : RUNNERS[S.where].name, est: w.usd, mins: w.min };
  S.jobStarted = true; S.view = 'jobs'; S.overlay = null; S.browse = false; S.menu = null; S.sel = [];
  S.toast = cloud ? `Renting a machine · about ${fmtMin(w.min)}` : `Queued on ${RUNNERS[S.where].name}`;
  setTimeout(() => { S.toast = null; render(); }, 2800);
}
function act(name, el, e) {
  if (name !== 'rc') S.rc = null;
  if (APP.act && APP.act(name, el, e) === true) { render(); return; }
  const d = el ? el.dataset : {};
  switch (name) {
    case 'toggle': { const id = +d.id; S.sel = S.sel.includes(id) ? S.sel.filter(x => x !== id) : [...S.sel, id].sort((a, b) => a - b); break; }
    case 'selall': { const q = S.find.trim().toLowerCase(); S.sel = SCENES.filter(s => !q || s.title.toLowerCase().includes(q)).map(s => s.id); break; }
    case 'clear': S.sel = []; S.overlay = null; break;
    case 'nav': S.view = d.v; S.overlay = null; S.browse = false; S.menu = null; S.rbf = false; break;
    case 'op': S.op = d.v; if (!OPS[S.op].cloud && S.where === 'cloud') S.where = 'pc'; break;
    case 'qual': S.q = d.v; break;
    case 'size': S.size = d.v; break;
    case 'adv': S.adv = !S.adv; break;
    case 'kn': if (d.t === 'sw') S.kn[d.k] = !S.kn[d.k]; else S.kn[d.k] = d.v; break;
    case 'where': S.where = d.v; S.menu = null; break;
    case 'pick': S.pick = d.id; break;
    case 'rb-browse': S.browse = true; S.menu = null; enterKey('browse'); break;
    case 'rb-back': S.browse = false; S.menu = null; S.rbf = false; break;
    case 'rb-use': S.browse = false; S.menu = null; S.rbf = false; S.where = 'cloud'; break;
    case 'menu': S.menu = S.menu === d.m ? null : d.m; break;
    case 'setf': if (d.k === 'sort') S.sort = d.v; else S.f[d.k] = d.k === 'count' && d.v !== 'any' ? +d.v : d.v; S.menu = null; break;
    case 'prov': S.pf[d.v] = S.pf[d.v] === false; break;
    case 'step': { const arr = STEPS[d.k]; const i = Math.max(0, Math.min(arr.length - 1, arr.indexOf(S.f[d.k]) + (+d.dir))); S.f[d.k] = arr[i]; break; }
    case 'sw': if (d.k === 'dcOnly') S.dcOnly = !S.dcOnly; else S.f[d.k] = !S.f[d.k]; break;
    case 'resetf': S.f = { ...FDEF }; S.dcOnly = false; break;
    case 'rx': S.rx[d.id] = !S.rx[d.id]; break;
    case 'filters': S.rbf = !S.rbf; S.menu = null; break;
    case 'refresh': S.toast = 'Offers refreshed'; setTimeout(() => { S.toast = null; render(); }, 1600); break;
    case 'theme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; break;
    case 'rc': S.rc = S.rc === d.id ? null : d.id; break;
    case 'run': if (S.where === 'cloud') S.overlay = 'confirm'; else startRun(); break;
    case 'run-confirm': startRun(); break;
    case 'rent': S.toast = 'Rental requested (standalone mock)'; setTimeout(() => { S.toast = null; render(); }, 2000); break;
    case 'pause': S.paused = !S.paused; break;
    case 'stop': S.toast = 'Stopped. Nothing partial was kept.'; setTimeout(() => { S.toast = null; render(); }, 2200); break;
    case 'wake': S.toast = 'Waking the NAS · about 40 s'; setTimeout(() => { S.toast = null; render(); }, 2200); break;
    case 'lim': { const st = { maxHour: [0.25, 0.25, 4], jobCap: [0.5, 0.5, 10], month: [5, 5, 50] }[d.k]; BUDGET[d.k] = Math.max(st[1], Math.min(st[2], +(BUDGET[d.k] + st[0] * (+d.dir)).toFixed(2))); break; }
    case 'replace': S.overlay = 'replace'; break;
    case 'replace-confirm': S.decided = 'replaced'; S.overlay = null; break;
    case 'discard': S.decided = 'discarded'; S.overlay = null; break;
    case 'later': S.view = 'library'; S.overlay = null; break;
    case 'noop': break;
    case 'close': S.overlay = null; S.menu = null; S.rbf = false; break;
    default: console.warn('unhandled act', name);
  }
  if (APP.post) APP.post(name, S);
  render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (S.menu || S.rc) { S.menu = null; S.rc = null; render(); } return; }
  if (t.getAttribute('aria-disabled') === 'true' && !t.dataset.always) return;
  act(t.dataset.act, t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.menu || S.rc || S.rbf) { S.menu = null; S.rc = null; S.rbf = false; render(); } else if (S.overlay || S.browse) { act('close'); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=radio],[role=checkbox],[role=menuitemradio],.tip'))
  { if (e.target.matches('[data-act]')) { e.preventDefault(); e.target.click(); } }
});
document.addEventListener('mouseover', e => {
  const t = e.target.closest('.tip[data-id]');
  if (t) showRc(t.dataset.id, t.querySelector('.iconbtn'));
});
document.addEventListener('mouseout', e => {
  const t = e.target.closest('.tip[data-id]');
  if (t && !t.contains(e.relatedTarget)) { const a = S.rc && $(`.tip[data-id="${S.rc}"] .iconbtn`); if (a) showRc(S.rc, a); else hideRc(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-in="find"]')) { S.find = t.value; const p = t.selectionStart; render(); const n = $('[data-in="find"]'); if (n) { n.focus(); n.setSelectionRange(p, p); } }
  else if (t.matches('[data-in="wipe"]')) { S.wipe = +t.value; const c = t.closest('[data-cmp]'); if (c) c.style.setProperty('--x', S.wipe + '%'); }
});
document.addEventListener('focusin', e => { const t = e.target.closest('.tip[data-id]'); if (t) showRc(t.dataset.id, t.querySelector('.iconbtn')); });
document.addEventListener('focusout', e => { const t = e.target.closest('.tip[data-id]'); if (t && !S.rc) hideRc(); });
let rsT = 0; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if ((innerWidth < 600) !== S.ph) render(); setProfile(); }, 120); });

/* ---------- profile (Lucent derives targets, rows, type from this) ---------- */
function setProfile() {
  const w = innerWidth, h = document.documentElement;
  h.dataset.luProfile = w < 600 ? 'phone' : (w < 900 ? 'tablet' : 'desktop');
  h.dataset.luTier = 't1';
  if (P.get('ts') === '2') h.dataset.ts = '2';
}

/* ---------- named states (the same names in every concept) ---------- */
const STATE_LIST = [
  ['compose', 'Compose'], ['quality', 'Quality'], ['where', 'Where'], ['cloud', 'Cloud (hero)'], ['breakdown', 'Cost breakdown'],
  ['browse', 'Browse all offers'], ['details', 'Row details'], ['sortmenu', 'Sort menu'], ['filters', 'Filters'], ['standalone', 'Standalone browser'],
  ['confirm', 'Paid confirm'], ['jobs', 'Jobs'], ['review', 'Review'], ['replace', 'Replace confirm'], ['runners', 'Runners'], ['cloudset', 'Cloud settings'], ['edge', 'States board'],
];
function applyState(name) {
  Object.assign(S, { view: 'library', overlay: null, menu: null, rc: null, rbf: false, browse: false, where: 'pc', adv: false, job: P.get('job') !== '0', pick: 'v1', sort: 'auto', f: { ...FDEF }, dcOnly: false, sel: [1, 2, 3], op: 'decensor', q: 'high', toast: null, paused: false, jobStarted: false, decided: null, edge: null, rx: {} });
  const cloud = () => { S.where = 'cloud'; S.overlay = 'picker'; };
  switch (name) {
    case 'compose': break;
    case 'quality': S.overlay = 'quality'; S.adv = true; break;
    case 'where': S.overlay = 'where'; break;
    case 'cloud': cloud(); break;
    case 'breakdown': cloud(); S.rc = 'v1'; break;
    case 'browse': cloud(); S.browse = true; break;
    case 'details': cloud(); S.browse = true; S.rx = { v1: 1 }; break;
    case 'sortmenu': cloud(); S.browse = true; S.menu = 'sort'; break;
    case 'filters': cloud(); S.browse = true; S.rbf = true; break;
    case 'standalone': S.browse = true; S.job = false; S.sel = []; S.pick = browse(S, INFO()).rows[0].o.id; break;
    case 'confirm': S.where = 'cloud'; S.overlay = 'confirm'; break;
    case 'jobs': S.view = 'jobs'; S.sel = []; break;
    case 'review': S.view = 'review'; S.sel = []; break;
    case 'replace': S.view = 'review'; S.overlay = 'replace'; S.sel = []; break;
    case 'runners': S.view = 'runners'; S.sel = []; break;
    case 'cloudset': S.view = 'cloud'; S.sel = []; break;
    case 'edge': S.view = 'edge'; S.sel = []; break;
  }
  S.state = name;
  if (APP.onState) APP.onState(name, S);
}

/* ---------- mock bar: lives outside the product UI, hidden with ?shot=1 ---------- */
function mockHTML() {
  const chips = STATE_LIST.map(([id, l]) => `<button data-m="${id}" aria-pressed="${ck(S.state === id)}">${l}</button>`).join('');
  return `<b>${esc(APP.name)}</b>${chips}<span class="sep"></span>
    <button data-m="_theme">${S.theme === 'dark' ? 'Dark' : 'Light'}</button>
    <button data-m="_prov">${S.providers} provider${S.providers > 1 ? 's' : ''}</button>`;
}
function syncMock() { const m = $('#mock'); if (m) m.innerHTML = mockHTML(); }
document.addEventListener('click', e => {
  const b = e.target.closest('#mock [data-m]'); if (!b) return;
  const id = b.dataset.m;
  if (id === '_theme') S.theme = S.theme === 'dark' ? 'light' : 'dark';
  else if (id === '_prov') S.providers = S.providers === 1 ? 2 : 1;
  else applyState(id);
  render();
});

/* ---------- boot ---------- */
function boot(app) {
  APP = app;
  const h = document.documentElement;
  if (P.get('shot') === '1') h.dataset.shot = '';
  setProfile();
  const mock = document.createElement('div'); mock.id = 'mock'; mock.className = 'mock'; document.body.prepend(mock);
  const root = document.createElement('div'); root.id = 'app'; root.className = 'appfit'; document.body.append(root);
  applyState(P.get('s') || 'compose');
  render();
}

/* ===== shared builders, part 1: status, library, header pills, what / quality / where ===== */
const RSTAT = {
  pc:  { state: 'busy',   word: 'Busy',   load: 97, note: 'Running 1 job · starts yours in about 9 min', head: 'Busy · starts in ~9 min' },
  nas: { state: 'asleep', word: 'Asleep', load: 0,  note: 'Wakes in about 40 s', head: 'Asleep · wakes in ~40 s' },
};
function statusHTML(state, word) {
  const m = { ok: ['ok', 'dot'], busy: ['run', 'dot'], asleep: ['off', 'moon'], offline: ['bad', 'power'], warn: ['warn', 'alert'] }[state];
  return `<span class="st ${m[0]}">${m[1] === 'dot' ? '<i class="dot"></i>' : I(m[1])}${esc(word)}</span>`;
}
const seg = (act, k, opts, cur, label, extra = '') =>
  `<div class="seg ${extra}" role="radiogroup" aria-label="${esc(label)}">${opts.map(([v, l]) => `<button role="radio" aria-checked="${ck(cur === v)}" data-act="${act}" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
const sw = (on, attrs, label) => `<button class="sw" role="switch" aria-checked="${ck(on)}" aria-label="${esc(label)}" ${attrs}></button>`;

/* ---------- header pills: slim glass chips, each with a mini-graphic ---------- */
function hdrPills(S) {
  const left = BUDGET.month - BUDGET.spent;
  return `<div class="pills">
    <button class="hp" data-act="nav" data-v="runners" aria-label="This PC: busy, ${RSTAT.pc.load} percent">${I('cpu')}<span class="nm">This PC</span><span class="mini"><i style="width:${RSTAT.pc.load}%"></i></span><span class="num">${RSTAT.pc.load}%</span></button>
    <button class="hp" data-act="nav" data-v="runners" aria-label="NAS: asleep">${I('server')}<span class="nm">NAS</span>${I('moon', 's')}<span class="wd">Asleep</span></button>
    <button class="hp" data-act="nav" data-v="cloud" aria-label="Cloud: ${usd(left)} left this month">${I('cloud')}<span class="nm">Cloud</span><span class="num">${usd(left)}<span class="wd"> left</span></span></button>
  </div>`;
}

/* ---------- library ---------- */
function sceneTile(s, on) {
  return `<div class="tile" role="checkbox" aria-checked="${ck(on)}" aria-label="${esc(s.title)}, ${resName(s.h)}, ${fmtDur(s.dur)}" tabindex="0" data-act="toggle" data-id="${s.id}">
    <div class="frame"><div class="pic tn tn-${s.tn}">
      <span class="chk">${I('check')}</span>
      <span class="pp tr pill-pic">${resName(s.h)}</span>
      <span class="pp br pill-pic">${fmtDur(s.dur)}</span>
      ${s.done ? `<span class="pp bl pill-pic ok">${I('checkCircle')}Cleaned</span>` : ''}
    </div></div>
    <div class="tt">${esc(s.title)}</div><div class="ts">${esc(s.studio)} · ${gbf(s.gb)}</div>
  </div>`;
}
function libraryHTML(S) {
  const q = S.find.trim().toLowerCase();
  const list = SCENES.filter(s => !q || s.title.toLowerCase().includes(q));
  const all = list.every(s => S.sel.includes(s.id));
  return `<div class="lib-tools">
      <label class="field grow">${I('search')}<input type="search" placeholder="Search 1,248 scenes" aria-label="Search scenes" value="${esc(S.find)}" data-in="find"></label>
      <button class="chip">${I('sort')}Newest${I('chevD', 's')}</button>
      <button class="chip">${I('film')}Any size${I('chevD', 's')}</button>
      <button class="chip" data-on>${I('tag')}Not cleaned yet</button>
      <button class="linkbtn" data-act="${all ? 'clear' : 'selall'}">${all ? 'Clear' : 'Select all ' + list.length}</button>
    </div>
    <div class="grid">${list.map(s => sceneTile(s, S.sel.includes(s.id))).join('')}</div>
    <div class="pager"><span class="cap muted">1–${list.length} of 1,248</span><button class="btn quiet">${I('chevR')}Next page</button></div>`;
}

/* ---------- estimates for the current choices ---------- */
function estFor(S, info, patch = {}) {
  const s = { ...S, ...patch };
  if (s.where === 'cloud') {
    const o = OFFERS.find(x => x.id === s.pick), q = cloudQuote(info, s.op, s.q, o, s);
    return { cloud: true, min: q.minutes, usd: q.total, ok: q.ok, why: q.why, o, q };
  }
  const h = homeQuote(info, s.op, s.q, s.where, s.size);
  return { cloud: false, min: h.min, usd: 0, ok: h.ok, why: h.why };
}
const estLine = e => (e.cloud ? `${fmtMin(e.min)} · ~${usd(e.usd)}` : `${fmtMin(e.min)} · Free`);

/* ---------- WHAT ---------- */
function opRows(S) {
  return Object.entries(OPS).map(([k, o]) => `<button class="opt" role="radio" aria-checked="${ck(S.op === k)}" data-act="op" data-v="${k}">
    <span class="gt sm">${I(o.ico)}</span>
    <span class="om"><span class="on">${o.name}</span><span class="oh">${o.hint}${o.cloud ? '' : ' · runs at home only'}</span></span>
    <span class="radio">${I('check')}</span></button>`).join('');
}

/* ---------- QUALITY (plain words first, expert knobs under Advanced) ---------- */
function qualityRows(S, info) {
  if (S.op === 'transcode') {
    return `<div class="knob" style="padding:var(--lu-space-2) var(--lu-space-3)"><div class="kl"><b>Output size</b><span>Smaller files play and sync faster.</span></div>${seg('size', 'size', Object.entries(SIZES), S.size, 'Output size')}</div>`;
  }
  if (S.op === 'upscale') {
    return `<p class="cap muted" style="padding:var(--lu-space-3) var(--lu-space-3) var(--lu-space-1)">Upscale has a single setting. Fine-tune it under Advanced.</p>`;
  }
  return Object.entries(QUALITIES).map(([k, Q]) => {
    const e = estFor(S, info, { q: k });
    const dis = !e.ok && !e.cloud;
    const end = dis ? `<span class="oe"><b class="warn">${esc(e.why)}</b></span>`
      : e.cloud ? `<span class="oe"><b>~${usd(e.usd)}</b><span>${fmtMin(e.min)}</span></span>` : `<span class="oe"><b>${fmtMin(e.min)}</b><span>Free</span></span>`;

  const o = OFFERS.find(x => x.id === S.pick), q = cloudQuote(info, S.op, S.q, o, S);
  return { o, q, after: budgetAfter(q.total) };
}
function confirmBody(S, info) {
  const { o, q, after } = runKey(S, info);

  return `<p class="muted" style="margin-bottom:var(--lu-space-4)">${esc(jobName())} · ${info.n} scene${info.n > 1 ? 's' : ''} · ${fmtDur(info.dur)}</p>
    <div class="row" style="gap:var(--lu-space-3);margin-bottom:var(--lu-space-4)"><span class="gt sm">${I(tierIco(o.tier))}</span><div class="col grow"><b>${gpuName(o)} · ${esc(o.loc)}</b><span class="cap muted">${TIER[o.tier]} · ${o.prov} · ${o.rel}% reliable · ${usd(o.price)}/h</span></div></div>
    <div class="rc">
      <span>Compute<span class="why">${fmtMin(q.minutes)} × ${usd(o.price)}/h</span></span><span class="v">${usd(q.compute)}</span>
      <span>Data transfer<span class="why">${free ? 'No transfer fee at ' + o.prov : gbf(q.gbTotal) + ' × ' + perGBtxt(o)}</span></span><span class="v">${usd(q.transfer)}</span>
      <div class="sub"><span>Upload · your video</span><span>${gbf(q.gbUp)}</span><span>Download · the result</span><span>${gbf(q.gbDown)}</span><span>Machine setup · models</span><span>${gbf(q.gbModels)}</span></div>

      <dt>Stops by itself at</dt><dd>${usd(BUDGET.jobCap)}<small>per rental, nothing partial is kept</small></dd>
      <dt>This month</dt><dd>${usd(BUDGET.spent)} → ${usd(BUDGET.spent + q.total)}<small>of ${usd(BUDGET.month)} · ${usd(after.left)} left after</small></dd>
      <dt>Credit</dt><dd>${usd(BUDGET.credit)} → ${usd(after.credit)}<small>on ${o.prov}</small></dd>

function paidActions(S, info, opts = {}) {
  const { q } = runKey(S, info);
  return `<button class="btn quiet" data-act="${opts.cancel || 'close'}" autofocus>${I('x')}Cancel</button>
    <button class="btn quiet t-accent" data-act="run-confirm">${I('coin')}Rent GPU &amp; run · ~${usd(q.total)}</button>`;
}

/* ===== shared builders, part 3: jobs, review, runners, cloud settings, states board ===== */
const seeded = (n, seed = 7) => { const o = []; let x = seed; for (let i = 0; i < n; i++) { x = (x * 1103515245 + 12345) & 0x7fffffff; o.push(14 + (x % 30)); } return o; };
const blocksHTML = () => `<div class="patch blocks">${seeded(72).map(v => `<i style="--l:${v}"></i>`).join('')}</div>`;
const JOB_HOME = { name: 'Lake house, day one', op: 'Decensor', q: 'Balanced', pct: 64, frame: 22257, frames: 34776, fps: 23.4, left: '8:42', gpu: 97, vram: '8.4 / 10 GB', temp: 71, watts: 318 };
const JOB_CLOUD = { name: 'Winter cabin', op: 'Decensor', q: 'High detail', pct: 38, spent: 0.15, est: 0.37, frame: 13214, frames: 34776, fps: 40.1, left: '14:20', gpu: 96, vram: '17.9 / 32 GB', rented: '14 min', sent: '2.0 GB' };
const REVIEW = { name: 'Old town stroll', op: 'Decensor + upscale', q: 'High detail', from: '1080p', to: '4K', gbFrom: 1.6, gbTo: 3.4, gpu: 'RTX 5090 · Frankfurt', prov: 'Vast.ai', cost: 0.30, took: '2 h 05 min', segs: [[6, 4], [13, 3], [22, 5], [34, 2], [41, 6], [57, 3], [66, 4], [78, 3], [90, 4]] };

function jobMedia() {

}

}
function statRows(a) { return `<dl class="jstats">${a.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`; }
