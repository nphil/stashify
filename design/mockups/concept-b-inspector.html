const pageHead = (title, sub, right = '') => `<div class="pagehd"><div class="col"><h1 class="ttl">${title}</h1>${sub ? `<span class="cap muted">${sub}</span>` : ''}</div>${right}</div>`;

function summaryLine(S, info, w, short) {
  if (!w.ok) return `<span class="warn row" style="gap:6px">${I('alert', 's')}${esc(w.why)}. Pick another quality or runner.</span>`;
  const cost = S.where === 'cloud' ? `${short ? '~' : 'costs about '}<b>${usd(w.usd)}</b>${tipHTML(S.pick)}` : `<b>Free</b>`;
  return `<span>${short ? 'About ' : 'Takes about '}<b class="nw">${fmtMin(w.min)}</b> <span class="dotsep">·</span> <span class="nw">${cost}</span></span>`;
}
function nudgeHTML(S, info) {
  if (!OPS[S.op].cloud) return '';
  if (S.where === 'cloud') {
    const h = homeQuote(info, S.op, S.q, 'pc', S.size);
    return `<button class="linkbtn" data-act="where" data-v="pc">${I('monitor', 's')}This PC: ${fmtMin(h.min)} · Free${I('chevR', 's')}</button>`;
  }
  const r = valueRec(info);
  return r ? `<button class="linkbtn" data-act="where" data-v="cloud">${I('cloud', 's')}Cloud: ${fmtMin(r.q.minutes)} · ~${usd(r.q.total)}${I('chevR', 's')}</button>` : '';
}

/* ===== Concept B · Inspector: a panel on the right that follows what you select ===== */
CONCEPT_ID = 'b';

/* ---------- the inspector with scenes selected: three rows that open in place, one pinned Run ---------- */
function accRow(id, ico, label, value, body) {
  const open = S.overlay === id;
  return `<div class="acc"><button class="orow acch" aria-expanded="${ck(open)}" data-act="pop" data-v="${id}"><span class="gt sm">${I(ico)}</span><span class="al">${label}</span><span class="av">${esc(value)}</span>${I('chevD', 'cv')}</button>${open ? `<div class="accb enter">${body}</div>` : ''}</div>`;
}
function bCompose(S, info) {
  const w = whereQuote(info), cloud = S.where === 'cloud', ok = w.ok;
  const picked = SCENES.filter(s => S.sel.includes(s.id));
  const gb = picked.reduce((a, s) => a + s.gb, 0);
  const compact = S.ph && S.overlay === 'picker';
  const head = `<div class="ihead"><span class="stk" aria-hidden="true">${picked.slice(0, 4).map(s => `<i class="tn tn-${s.tn}"></i>`).join('')}</span>
    <div class="col grow"><b>${info.n} scene${info.n > 1 ? 's' : ''}</b><span class="cap muted">${fmtDur(info.dur)} · ${gbf(gb)}</span></div>
    <button class="iconbtn" data-act="clear" aria-label="Clear selection">${I('x')}</button></div>`;
  const rows = compact ? '' : `<div class="accs">
    ${accRow('op', OPS[S.op].ico, 'What', OPS[S.op].name, `<div class="opt-list" role="radiogroup" aria-label="What to do">${opRows(S)}</div>`)}
    ${accRow('quality', 'sliders', 'Quality', qualLabel(), `<div class="opt-list" role="radiogroup" aria-label="Quality">${qualityRows(S, info)}</div>${advancedBlock(S, knobCount(S))}`)}
    ${accRow('where', whereIco(), 'Where', whereLabel(), `<div class="opt-list" role="radiogroup" aria-label="Where to run">${whereRows(S, info)}</div>`)}
  </div>`;
  const run = `<button class="btn primary run wide" ${ok ? '' : 'aria-disabled="true"'} data-act="run">${cloud ? I('coin') : ''}${cloud ? `Run · ~${usd(w.usd)}` : 'Run'}</button>`;
  const nudge = nudgeHTML(S, info);
  return `<aside class="insp${S.ph ? ' sheet' : ''}" aria-label="Run settings"><div class="insp-b">${head}${rows}</div>
    <div class="insp-f"><div class="isum cap">${summaryLine(S, info, w)}</div>${nudge && !compact ? `<div class="inudge">${nudge}</div>` : ''}${cloud && ok && !compact ? `<div class="bud">${budgetHTML(w.usd)}</div>` : ''}${run}</div></aside>`;
}

/* ---------- nothing selected: the inspector is the overview ---------- */
function bOverview(S) {
  const left = BUDGET.month - BUDGET.spent;
  const row = (ico, name, sub, v) => `<button class="orow brow" data-act="nav" data-v="${v}"><span class="gt sm">${I(ico)}</span><span class="col grow"><b class="ell">${name}</b><span class="cap muted ell">${sub}</span></span>${I('chevR', 's')}</button>`;
  return `<aside class="insp" aria-label="Overview"><div class="insp-b">
    <div class="col" style="gap:2px"><h2 class="ttl">Nothing selected</h2><span class="cap muted">Tick scenes on the left. Their settings open here.</span></div>
    <div class="blk"><h3 class="h">Runners</h3>
      ${row('monitor', 'This PC · RTX 3080', statusHTML('busy', RSTAT.pc.head), 'runners')}
      ${row('server', 'NAS · Tesla P40', statusHTML('asleep', RSTAT.nas.head), 'runners')}
      ${row('cloud', 'Cloud · Vast.ai', `${usd(left)} left this month · ${usd(BUDGET.credit)} credit`, 'cloud')}</div>
    <div class="blk"><h3 class="h">Running now</h3>
      ${row('bolt', JOB_HOME.name, `This PC · ${JOB_HOME.pct}% · ${JOB_HOME.left} left`, 'jobs')}
      ${row('bolt', JOB_CLOUD.name, `Vast.ai · ${JOB_CLOUD.pct}% · ${usd(JOB_CLOUD.spent)} so far`, 'jobs')}</div>
    <div class="blk"><h3 class="h">Ready to review</h3>
      ${S.decided ? `<span class="cap muted" style="padding:var(--lu-space-2)">Nothing waiting.</span>` : row('eye', REVIEW.name, `${REVIEW.op} · ${REVIEW.from} to ${REVIEW.to}`, 'review')}</div>
  </div></aside>`;
}

/* ---------- the card picker takes the library's place; the inspector stays as the job summary ---------- */
function bPicker(S, info) {
  const picked = SCENES.filter(s => S.sel.includes(s.id));
  const sending = `<div class="b-sel"><h3 class="h" style="padding:var(--lu-space-2) var(--lu-space-1)">Sent to the machine · ${gbf(picked.reduce((a, s) => a + s.gb, 0))}</h3>${picked.map(s => `<div class="qrow"><i class="tn tn-${s.tn} mt"></i><div class="col grow"><b class="ell">${esc(s.title)}</b><span class="cap muted ell">${resName(s.h)} · ${fmtDur(s.dur)}</span></div><span class="cap muted nw">${gbf(s.gb)}</span></div>`).join('')}</div>`;
  return `<section class="b-pane" aria-label="Pick a cloud GPU" data-scroll="picker"><div><button class="linkbtn" data-act="close">${I('chevL', 's')}Back to the library</button></div>${cloudSimple(S, info, { footer: false })}${sending}</section>`;
}

/* ---------- the paid confirm and the replace confirm take over the inspector, with a way back ---------- */
function bConfirm(S, info) {
  return `<aside class="insp${S.ph ? ' sheet' : ''}" aria-labelledby="ct"><div class="insp-b">
    <div><button class="linkbtn" data-act="close">${I('chevL', 's')}Back to settings</button></div>
    <h2 class="ttl" id="ct">Rent a GPU and run?</h2>${confirmBody(S, info)}</div>
    <div class="insp-f pair">${paidActions(S, info)}</div></aside>`;
}
function bReplace() {
  return `<aside class="insp${S.ph ? ' sheet' : ''}" aria-labelledby="ct"><div class="insp-b"><h2 class="ttl" id="ct">Replace the original?</h2>${replaceBody()}</div>
    <div class="insp-f pair"><button class="btn quiet" data-act="close" autofocus>${I('undo')}Keep reviewing</button><button class="btn quiet t-danger" data-act="replace-confirm">${I('swap')}Replace original</button></div></aside>`;
}

/* ---------- jobs: a list on the left, the selected job in the inspector ---------- */
function bJobSel(S) { return S.jsel || (S.jobStarted ? 'new' : 'home'); }
function bJobList(S) {
  const sel = bJobSel(S);
  const row = (id, ico, name, sub, pct, right) => `<button class="orow jrow" aria-current="${ck(sel === id)}" data-act="jsel" data-v="${id}"><span class="gt sm">${I(ico)}</span>
    <span class="col grow"><b class="ell">${name}</b><span class="cap muted ell">${sub}</span><span class="bar"><i class="run" style="width:${pct}%"></i></span></span>
    <span class="col end"><b class="num">${pct}%</b><span class="cap muted nw">${right}</span></span></button>`;
  return `${pageHead('Jobs', '2 running · 2 waiting')}<div class="jlist">
    ${S.jobStarted ? row('new', 'clock', esc(jobName()), 'Waiting for This PC', 0, 'about 9 min') : ''}
    ${row('home', 'monitor', JOB_HOME.name, `${JOB_HOME.op} · ${JOB_HOME.q} · This PC`, JOB_HOME.pct, `${JOB_HOME.left} left`)}
    ${row('cloud', 'cloud', JOB_CLOUD.name, `${JOB_CLOUD.op} · ${JOB_CLOUD.q} · Vast.ai · ${usd(JOB_CLOUD.spent)} so far`, JOB_CLOUD.pct, `${JOB_CLOUD.left} left`)}</div>
    <section aria-label="Up next"><h3 class="h" style="padding:var(--lu-space-2) var(--lu-space-1)">Up next</h3><div class="qlist">${queueRows()}</div></section>`;
}
function bJobSide(S) {
  const sel = bJobSel(S);
  return `<aside class="insp" aria-label="Job details"><div class="insp-b">${sel === 'cloud' ? cloudJobCard(S) : sel === 'new' ? newRunCard(S) : homeJobCard(S)}</div></aside>`;
}

/* ---------- review: the stage on the left, the decision in the inspector ---------- */
function bReview(S) {
  if (S.decided) return { main: `${pageHead('Review', 'Nothing waiting')}<div style="padding-bottom:var(--lu-space-4)">${decidedBanner(S)}</div><button class="btn" data-act="nav" data-v="library">${I('grid')}Back to the library</button>`, side: '' };
  const side = S.overlay === 'replace' ? bReplace() : `<aside class="insp" aria-label="Decision"><div class="insp-b">
      <div class="col" style="gap:2px"><h2 class="ttl">${REVIEW.name}</h2><span class="cap muted">${REVIEW.op} · ${REVIEW.q}</span></div>${reviewFacts()}</div>
    <div class="insp-f pair"><button class="btn quiet" data-act="discard">${I('x')}Discard</button><button class="btn quiet t-danger" data-act="replace">${I('swap')}Replace original</button></div></aside>`;
  return { main: `${pageHead('Review', '1 waiting · drag the handle to compare')}<div class="col" style="gap:var(--lu-space-3)">${compareStage(S)}</div>`, side };
}

function bView(S) {
  const info = INFO();
  let main = '', side = '', solo = false, rbp = false;
  if (S.browse) { main = `<div class="b-rbpage${S.job ? ' sheet' : ''}">${rentBrowser(S, info)}</div>`; solo = rbp = true; }
  else switch (S.view) {
    case 'jobs': main = bJobList(S); side = bJobSide(S); break;
    case 'review': ({ main, side } = bReview(S)); solo = !side; break;
    case 'runners': main = `<div class="narrow">${pageHead('Runners', 'Where jobs can run')}${runnersHTML(S)}</div>`; solo = true; break;
    case 'cloud': main = `<div class="narrow">${pageHead('Cloud settings', 'Provider, limits and this month')}${cloudSettingsHTML(S)}</div>`; solo = true; break;
    case 'edge': main = `${pageHead('Empty, loading and error states', 'Mock-only board')}${edgeBoard(S)}`; solo = true; break;
    default:
      main = S.sel.length && S.overlay === 'picker' ? bPicker(S, info) : libraryHTML(S);
      side = !S.sel.length ? bOverview(S) : S.overlay === 'confirm' ? bConfirm(S, info) : bCompose(S, info);
  }
  return `<div class="b-shell" data-lu-tier="t1">${iconSprite()}${appHeader(S)}
    <div class="b-body${solo ? ' solo' : ''}${rbp ? ' rbp' : ''}"${S.ph ? ' data-scroll="main"' : ''}>
      <main class="b-main"${S.ph ? '' : ' data-scroll="main"'}><div class="wrap">${main}</div></main>${side}
    </div>
    ${appBottom(S)}<div class="toastwrap">${toastHTML(S)}</div></div>`;
}

const B = {
  name: 'B · Inspector',
  view: bView,
  act(name, el) {
    const d = el ? el.dataset : {};
    switch (name) {
      case 'pop': S.overlay = S.overlay === d.v ? null : d.v; S.menu = null; return true;
      case 'op': S.op = d.v; if (!OPS[S.op].cloud && S.where === 'cloud') S.where = 'pc'; S.overlay = null; return true;
      case 'where': S.where = d.v; S.menu = null; S.overlay = d.v === 'cloud' ? 'picker' : null; return true;
      case 'rb-use': S.browse = false; S.menu = null; S.rbf = false; S.where = 'cloud'; S.overlay = null; return true;
      case 'close':
        if (S.menu || S.rbf) { S.menu = null; S.rbf = false; return true; }
        if (S.browse && S.job) { S.browse = false; S.overlay = 'picker'; return true; }
        S.overlay = null; return true;
      case 'nav': S.view = d.v; S.overlay = null; S.browse = false; S.menu = null; S.rbf = false; return true;
      case 'rb-back': S.browse = false; S.menu = null; S.rbf = false; S.overlay = 'picker'; return true;
      case 'jsel': S.jsel = d.v; return true;
    }
    return false;
  },
  onState() {},
  after() {
    if (S.overlay === 'confirm' || S.overlay === 'replace') {
      const el = document.querySelector('.insp [autofocus]');
      if (el && document.activeElement !== el) el.focus({ preventScroll: true });
    }
  },
};

boot(B);
</script>
</body>
</html>
