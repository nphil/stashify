name: Build & publish images

# Builds the Stashify worker and runner images in the cloud (no local Docker
# needed) and pushes them to GitHub Container Registry. Triggers:
#   - pushing to main (ignoring docs/assets/unraid/markdown-only changes)
#   - pushing a version tag (v1.2.3)  -> semver tags + sha
#   - manual run (Actions tab / gh)
#
# Deploy on unRAID by pulling instead of building:
#   docker compose pull && docker compose up -d
# The images are pushed with Docker media types (oci-mediatypes=false below)
# because unRAID's Docker-tab update checker doesn't accept bare OCI image
# manifests — with OCI media types every version check 404s and the tab
# shows "not available". Public packages check anonymously; private ones
# also work if the server has done `docker login ghcr.io` once.

on:
  push:
    branches: ['main']
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - 'unraid/**'
      - '**.md'
    tags: ['v*']
  # Dispatching with a version cuts a RELEASE: images tagged X.Y.Z + latest,
  # a v-tag created on the dispatched ref, and a GitHub Release whose body is
  # `notes` (the changelog ShipLog shows on unRAID). Dispatch without a
  # version = plain rebuild, no release. This is the primary release path —
  # the git proxy used by Claude sessions cannot push tags directly.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z, no leading v). Empty = rebuild only.'
        required: false
        type: string
      notes:
        description: 'Release notes / changelog (markdown), shown by ShipLog'
        required: false
        type: string

# One run per ref. Do NOT cancel in-progress builds: the runner image takes
# ~25 min cold, and killing it for a small follow-up commit leaves ghcr without
# the image entirely (this bit us on the very first publish). New pushes queue.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    # The runner image is large (torch cu126 wheels + an ffmpeg compile take
    # ~20-30 min on a cold cache) — keep the timeout at 60m or above.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker
            image: ghcr.io/nphil/stashify
            dockerfile: Dockerfile
            context: .
          - name: runner
            image: ghcr.io/nphil/stashify-runner
            dockerfile: Dockerfile.lada
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # :latest moves ONLY on a v* tag push (flavor latest=auto adds it to
          # semver builds), never on plain main pushes. That keeps :latest ==
          # the newest release, so the image always carries a real
          # org.opencontainers.image.version label — ShipLog (and anything else
          # reading OCI labels) can show "2.1.0 -> 2.2.0" version spans and pull
          # the matching GitHub Release notes as the changelog. Main pushes
          # still build+push the sha tag for validation and cache warmth.
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # oci-mediatypes=false pushes Docker (schema2) manifests instead of
          # OCI ones. unRAID's update checker never sends
          # application/vnd.oci.image.manifest.v1+json in its Accept header,
          # and ghcr answers 404 for a media type the client didn't accept —
          # so a bare OCI manifest makes the Docker tab show Version
          # "not available" forever. provenance must stay off for this.
          outputs: type=image,oci-mediatypes=false,push=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # On a v* tag: publish a GitHub Release whose body is the annotated tag's
  # message. This is the app's changelog — ShipLog on unRAID resolves the
  # container's OCI source label to this repo and renders these release notes
  # in the Docker tab, so EVERY image release must have one. make_latest stays
  # false because /releases/latest must keep pointing at the winrunner-v*
  # releases (winrunner/setup-stashify-runner.ps1 downloads
  # /releases/latest/download/stashify-winrunner.zip).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      # Tag-push path: the annotated tag's message is the changelog.
      # Dispatch path: the `notes` input is.
      - name: Resolve tag + notes
        id: rel
        env:
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<SHIPLOG_EOF'
              printf '%s\n' "$NOTES_INPUT"
              echo SHIPLOG_EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<SHIPLOG_EOF'
              git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
              echo SHIPLOG_EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Stashify ${{ steps.rel.outputs.tag }}
          body: ${{ steps.rel.outputs.body }}
          generate_release_notes: true
          make_latest: false
